[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcmark"
version = "1.0.0"
description = "Read, validate, and render ArcMark .arc diagrams."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ArcMark"}]
keywords = ["arcmark", "diagram", "uml", "xml", "svg"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.scripts]
arcmark = "arcmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arcmark"]
